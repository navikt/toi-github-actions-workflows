on:
  workflow_call:
    inputs:
      deploy-workflow-filnavn:
        required: true
        type: string
        description: 'Filnavnet til appens deploy-workflow'
jobs:
  sammenlign-docker-baseimage-versjoner:
    runs-on: ubuntu-latest
    outputs:
      digests-er-like: ${{ steps.sammenlign.outputs.digests-er-like }}

    steps:
      # Workflow-en "lagre-docker-baseimage-digest" skal ha lagret  image.txt og digest.txt etter hver vellykket deploy til prod
      - name: Hent sist deployede baseimage navn og digest
        id: siste-deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=baseimage-digest&per_page=1" --jq '.artifacts[] | select(.expired | not) | .id')
          if [ -n "$artifact_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > /tmp/baseimage.zip
            echo "image=$(unzip -p /tmp/baseimage.zip image.txt 2>/dev/null | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
            echo "digest=$(unzip -p /tmp/baseimage.zip digest.txt 2>/dev/null | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
          fi

      - name: Autentiser mot GAR
        if: ${{ steps.siste-deploy.outputs.image != '' }} # TODO Hva skjer hvis denne if-en er false? Refaktorer slik at vi autentiserer etter early return (exit 0) nedenfor?
        uses: nais/login@v0
        with:
          team: toi

      - name: Sammenlign digests
        id: sammenlign
        env:
          DEPLOYED_IMAGE: ${{ steps.siste-deploy.outputs.image }}
          DEPLOYED_DIGEST: ${{ steps.siste-deploy.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOYED_IMAGE" ] || [ -z "$DEPLOYED_DIGEST" ]; then
            echo "Fant ingen base-image digest for siste deploy til prod."
            echo "digests-er-like=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current_digest_in_remote_registry=$(docker buildx imagetools inspect "$DEPLOYED_IMAGE" --format '{{json .Manifest}}' | jq -r '.digest')
          [[ "$current_digest_in_remote_registry" == sha256:* ]]
          echo "Siste deployede base-image ref: $DEPLOYED_IMAGE"
          echo "Siste deployede base-image digest: $DEPLOYED_DIGEST"
          echo "Nåværende digest i remote registry: $current_digest_in_remote_registry"

          if [ "$current_digest_in_remote_registry" = "$DEPLOYED_DIGEST" ]; then
            echo "digests-er-like=true" >> "$GITHUB_OUTPUT"
          else
            echo "digests-er-like=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Bygg og deploy
    needs: [ sammenlign-docker-baseimage-versjoner ]
    if: ${{ needs.sammenlign-docker-baseimage-versjoner.outputs.digests-er-like != 'true' }}
    runs-on: ubuntu-latest
    steps:
      # workflow_dispatch er et av få events som GITHUB_TOKEN kan starte nye kjøringer med
      - name: Kjør workflow ${{ inputs.deploy-workflow-filnavn }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_WORKFLOW: ${{ inputs.deploy-workflow-filnavn }}
        run: |
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')
          gh workflow run "$DEPLOY_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$default_branch"
