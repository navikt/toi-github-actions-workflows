on:
  workflow_call:
    inputs:
      java-version:
        required: true
        type: string
        description: "E.g. '17' or '21'"
      baseimage-tagged-ref:
        required: true
        type: string
        description: "Full tagged reference to the runtime base image (registry/path:tag)"
      deploy-to-dev-if-branch-name-is:
        required: false
        type: string
      app-navn:
        required: false
        type: string
        description: App name used to keep artifacts separate in a monorepo
jobs:
  call-build-java-gradlew:
    uses: navikt/toi-github-actions-workflows/.github/workflows/build-java-gradlew.yaml@v17 # zizmor: ignore[ref-confusion,unpinned-uses]
    with:
      java-version: ${{ inputs.java-version }}
      baseimage-tagged-ref: ${{ inputs.baseimage-tagged-ref }}
    permissions:
      contents: read
      id-token: write

  call-deploy:
    needs: call-build-java-gradlew
    uses: navikt/toi-github-actions-workflows/.github/workflows/deploy.yaml@v17 # zizmor: ignore[ref-confusion,unpinned-uses]
    with:
      image: ${{ needs.call-build-java-gradlew.outputs.image }}
      deploy-to-dev-if-branch-name-is: ${{ inputs.deploy-to-dev-if-branch-name-is }}
    permissions:
      contents: read
      id-token: write

  call-lagre-docker-baseimage-digest:
    needs: [call-build-java-gradlew, call-deploy]
    if: needs.call-deploy.outputs.deploy-to-prod-was-successful == 'true'
    uses: navikt/toi-github-actions-workflows/.github/workflows/lagre-docker-baseimage-digest.yaml@v17 # zizmor: ignore[ref-confusion,unpinned-uses]
    with:
      baseimage-tagged-ref: ${{ inputs.baseimage-tagged-ref }}
      baseimage-digest: ${{ needs.call-build-java-gradlew.outputs.baseimage-digest }}
      app-navn: ${{ inputs.app-navn }}
    permissions: { }
