on:
  workflow_call:
    inputs:
      java-version:
        required: true
        type: string
        description: "E.g. '17' or '21'"
      deploy-to-dev-if-branch-name-is:
        required: false
        type: string
jobs:
  call-build-java-gradlew:
    uses: navikt/toi-github-actions-workflows/.github/workflows/build-java-gradlew.yaml@v15 # zizmor: ignore[ref-confusion,unpinned-uses]
    with:
      java-version: ${{ inputs.java-version }}
    permissions:
      contents: read
      id-token: write

  call-deploy:
    needs: call-build-java-gradlew
    uses: navikt/toi-github-actions-workflows/.github/workflows/deploy.yaml@v15 # zizmor: ignore[ref-confusion,unpinned-uses]
    with:
      image: ${{ needs.call-build-java-gradlew.outputs.image }}
      deploy-to-dev-if-branch-name-is: ${{ inputs.deploy-to-dev-if-branch-name-is }}
    permissions:
      contents: read
      id-token: write

  call-trivy-security-scan:
    needs: call-build-java-gradlew
    uses: navikt/toi-github-actions-workflows/.github/workflows/trivy-security-scan.yaml@v15 # zizmor: ignore[ref-confusion,unpinned-uses]
    with:
      image: ${{ needs.call-build-java-gradlew.outputs.image }}
    permissions:
      id-token: write
      security-events: write

  call-lagre-docker-baseimage-digest:
    needs: call-deploy
    uses: navikt/toi-github-actions-workflows/.github/workflows/lagre-docker-baseimage-digest.yaml@v15 # zizmor: ignore[ref-confusion,unpinned-uses]
    with:
      image-ref: ${{ needs.call-deploy.outputs.image-ref }}
      image-digest: ${{ needs.call-deploy.outputs.image-digest }}
    permissions:
      contents: read
      id-token: write
