# Bygger Dependabot-PR-er med Gradle og merger patch- og minor-oppdateringer når bygget er grønt.
# Fungerer for ett Gradle-prosjekt og for monorepo med flere apper under samme rot-bygg.
on:
  workflow_call:
    inputs:
      java-version:
        required: true
        type: string
        description: "JDK-versjon på runneren, f.eks. '25'"
      deploy-workflow-filnavn:
        required: false
        type: string
        default: ''
        description: "Deploy-workflows som startes etter merge, adskilt med mellomrom eller linjeskift. Tom gir ingen deploy."

jobs:
  bygg:
    # Automerge-jobben sjekker at PR-en er én signert Dependabot-commit
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: ${{ inputs.java-version }}
          cache: 'gradle'

      - run: ./gradlew build

  automerge:
    needs: bygg
    uses: navikt/toi-github-actions-workflows/.github/workflows/dependabot-automerge.yaml@v17 # zizmor: ignore[ref-confusion,unpinned-uses]
    with:
      deploy-workflow-filnavn: ${{ inputs.deploy-workflow-filnavn }}
    permissions:
      contents: write
      pull-requests: write
      actions: write
